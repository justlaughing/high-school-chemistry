<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="{{BASE}}"><title>高中化学 · 知识点题库</title><link rel="stylesheet" href="题库工具/app.css?v=2"></head><body data-initial-view="{{VIEW}}"><div id="chem-app"><div class="cw-app" aria-label="化学题库界面">
  <header class="cw-header">
    <div class="cw-logo">化</div>
    <div><div class="cw-brand">高中化学 · 知识题库</div><div class="cw-local">知识点 / 题目 / 关联</div></div>
    <nav class="cw-nav" aria-label="题库视图">
      <button type="button" class="cw-navbutton cursor-interaction" data-view="library" aria-pressed="true">题库检索</button>
      <button type="button" class="cw-navbutton cursor-interaction" data-view="graph" aria-pressed="false">知识关联</button>
    </nav><a id="live-link" class="cw-live-link" hidden>进入实时题库 →</a>
  </header>
  <div class="cw-shell">
    <aside class="cw-side" aria-label="知识点目录">
      <div class="cw-side-heading">知识点目录<button type="button" class="cw-button cw-quiet cursor-interaction" data-action="collapse">收起</button></div>
      <p class="cw-side-note">点箭头展开，勾选加入检索</p>
      <input class="cw-topic-search" id="topic-search" type="search" aria-label="定位知识点" placeholder="定位知识点…"><label class="cw-empty-switch"><input id="show-empty" type="checkbox">显示暂无题目的类别</label><div class="cw-tree"></div>
      <div class="cw-side-footer"><button type="button" class="cursor-interaction" data-action="overview">题库概况与来源</button></div>
    </aside>
    <main class="cw-main">
      <section class="cw-library-view">
        <div class="cw-breadcrumb">题库首页 / 按知识点找题</div>
        <h1>从知识点，找到需要的题。</h1>
        <p class="cw-intro">选一个知识点练习，也可以组合多个知识点找综合题。</p>
        <form class="cw-search"><input type="search" aria-label="题目关键词" placeholder="输入知识点、题目关键词…"><button type="button" data-action="search" class="cw-button cw-primary cursor-interaction">检索题目</button></form>
        <div class="cw-selected" aria-live="polite"></div>
        <div class="cw-filterbar"><span class="cw-rule">匹配方式：同一道题同时包含全部已选知识点</span><button type="button" class="cw-button cw-quiet cursor-interaction" data-action="clear">清空条件</button></div>
        <details class="cw-more"><summary class="cursor-interaction">更多筛选</summary><div class="cw-filterfields"><label>题型<select id="cw-type" aria-label="题型"><option value="">全部题型</option></select></label><label>范围<select id="cw-scope" aria-label="匹配范围"><option value="all">主知识点＋相关知识点＋小问</option><option value="main">只按主知识点</option></select></label><label>批次<select id="cw-batch" aria-label="试卷批次"><option value="">全部批次</option></select></label><label>试卷<select id="cw-paper" aria-label="来源试卷"><option value="">全部试卷</option></select></label></div></details>
        <div class="cw-content" aria-live="polite"></div>
        <details class="cw-coverage"><summary class="cursor-interaction">各模块收录情况</summary><div class="cw-coverage-grid"></div><p class="cw-tiny">相关整题包含主知识点、相关知识点及小问。各模块相关题数不能直接相加。</p></details>
        <p class="cw-footnote">知识点分类为整理标注，原题、配图、公式与原解析保留。</p>
      </section>
      <section class="cw-graph-view" hidden></section><section class="cw-overview-view" hidden></section>
<div class="cw-monitor" id="monitor-status" role="status">正在读取题库…</div>

</main></div></div></div><script src="题库工具/live.js"></script><script src="题库工具/catalog.js"></script><script src="题库工具/app.js?v=2"></script></body></html>
